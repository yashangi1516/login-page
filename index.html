<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page For Laundry Services</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="https://www.shutterstock.com/image-vector/vector-washing-machine-illustration-flat-260nw-2669160789.jpg" alt="">
        </div>
        <div class="right">
            <h1>Hello Again!!!</h1>
            <p class="subtitle">Welcome Back!we missed you!</p>
             <div class="form-groups">
                <label>Email</label>
                <input type="email" placeholder="email@123.com">
             </div>

             <div class="form-groups">
                <label>Password</label>
                <input type="password" placeholder="enter password">
             </div>
             <div class="forgot">
                <a href="#">Forget Password</a>
             </div>

             <button class="login-btn">Login</button>

             <div class="register">
                Not a member? <a href="#">Register Now</a>
             </div>
        </div>
    </div>
</body>
</html>
